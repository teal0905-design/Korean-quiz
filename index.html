<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓文學習 App</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --secondary-color: #50E3C2;
      --bg-color: #F5F7FA;
      --card-bg: #FFFFFF;
      --text-color: #333333;
      --accent-color: #FF6B6B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 60px;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 18px 15px;
      font-size: 1.3rem;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    nav {
      display: flex;
      justify-content: space-around;
      background-color: white;
      border-bottom: 1px solid #E0E0E0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav button {
      flex: 1;
      padding: 14px 0;
      border: none;
      background: none;
      font-size: 1rem;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    nav button.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 卡片通用樣式 */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .audio-btn {
      background-color: #EBF3FE;
      color: var(--primary-color);
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 1.1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      transition: background-color 0.2s;
    }

    .audio-btn:active {
      background-color: #D0E3FC;
    }

    /* 單字測驗 */
    .quiz-card {
      text-align: center;
      padding: 30px 20px;
    }

    .quiz-word {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .option-btn {
      padding: 14px;
      border: 2px solid #E0E0E0;
      border-radius: 10px;
      background: white;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--primary-color);
    }

    .option-btn.correct {
      background-color: #E8F8F5;
      border-color: #2ECC71;
      color: #27AE60;
      font-weight: bold;
    }

    .option-btn.wrong {
      background-color: #FDEDEC;
      border-color: #E74C3C;
      color: #C0392B;
    }

    .next-btn {
      margin-top: 20px;
      padding: 12px 30px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 文法資料庫 */
    .grammar-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    .grammar-detail h3 {
      color: #2C3E50;
      margin: 18px 0 10px 0;
      font-size: 1.1rem;
      border-left: 4px solid var(--primary-color);
      padding-left: 8px;
    }

    .grammar-detail p {
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .grammar-detail ul {
      margin-left: 20px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      background-color: #E0E0E0;
      color: #555;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header>韓文學習平台</header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('textbook')">課文學習</button>
    <button class="nav-btn" onclick="switchTab('quiz')">單字測驗</button>
    <button class="nav-btn" onclick="switchTab('grammar')">文法資料庫</button>
  </nav>

  <div class="container">
    
    <!-- 1. 課文學習頁面 -->
    <div id="textbook" class="tab-content active">
      <div class="card">
        <h3>第一課：日常招呼與介紹</h3>
        <p style="margin-top: 10px;">
          안녕하세요. 만나서 반갑습니다.
          <button class="audio-btn" onclick="speakKorean('안녕하세요. 만나서 반갑습니다.')">🔊</button>
        </p>
        <p style="color: #666; font-size: 0.95rem; margin-top: 4px;">你好，很高興認識你。</p>
      </div>

      <div class="card">
        <h3>第二課：詢問價格與購物</h3>
        <p style="margin-top: 10px;">
          이것은 얼마예요? 조금 깎아 주세요.
          <button class="audio-btn" onclick="speakKorean('이것은 얼마예요? 조금 깎아 주세요.')">🔊</button>
        </p>
        <p style="color: #666; font-size: 0.95rem; margin-top: 4px;">這個多少錢？請算便宜一點。</p>
      </div>
    </div>

    <!-- 2. 單字測驗頁面 (不自動發音，需按喇叭按鈕) -->
    <div id="quiz" class="tab-content">
      <div class="card quiz-card">
        <span class="badge" id="quiz-count">題目 1 / 5</span>
        <div class="quiz-word">
          <span id="quiz-korean-text">--</span>
          <button class="audio-btn" onclick="playCurrentQuizAudio()">🔊</button>
        </div>
        <p style="color: #888; font-size: 0.9rem; margin-bottom: 15px;">（測驗時不自動朗讀，有需要請點擊🔊發音）</p>
        
        <div class="quiz-options" id="quiz-options-container">
          <!-- 選項由 JS 動態生成 -->
        </div>

        <button class="next-btn" id="next-quiz-btn" style="display:none;" onclick="loadNextQuestion()">下一題</button>
      </div>
    </div>

    <!-- 3. 文法資料庫頁面 -->
    <div id="grammar" class="tab-content">
      <div id="grammar-list-container">
        <!-- 由 JS 動態生成文法清單 -->
      </div>
    </div>

  </div>

  <script>
    /* ==========================================
       1. 強效雙發音引擎 (線上音訊優先 + 系統 TTS)
       ========================================== */
    function speakKorean(text) {
      if (!text) return;

      // 備援方案：系統內建 SpeechSynthesis
      function fallbackNativeTTS() {
        if (!('speechSynthesis' in window)) {
          alert('您的瀏覽器不支援發音，請點選右上角選單改用 Safari 或 Chrome 開啟！');
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ko-KR';
        utter.rate = 0.85;

        const voices = window.speechSynthesis.getVoices();
        const koVoice = voices.find(v => v.lang && (v.lang.startsWith('ko') || v.lang.includes('KR')));
        if (koVoice) utter.voice = koVoice;

        setTimeout(() => {
          window.speechSynthesis.speak(utter);
        }, 50);
      }

      // 優先方案：線上發音 API (不受 LINE/FB 內建瀏覽器限制)
      try {
        const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ko&q=${encodeURIComponent(text)}`;
        const audio = new Audio(audioUrl);
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => fallbackNativeTTS());
        }
      } catch (e) {
        fallbackNativeTTS();
      }
    }

    // 預先載入語音包（解決部分 Android 瀏覽器首次點擊問題）
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    /* ==========================================
       2. 分頁切換邏輯
       ========================================== */
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    /* ==========================================
       3. 單字測驗資料與邏輯 (不自動發音)
       ========================================== */
    const quizData = [
      { korean: "깎다", options: ["殺價", "居住", "休息", "學習"], answer: 0 },
      { korean: "듣다", options: ["走路", "聽", "詢問", "相信"], answer: 1 },
      { korean: "덥다", options: ["冷", "輕", "熱", "重"], answer: 2 },
      { korean: "모르다", options: ["快", "不知道", "唱", "上升"], answer: 1 },
      { korean: "어떻다", options: ["黑色", "黃色", "如何", "這樣"], answer: 2 }
    ];

    let currentQuizIndex = 0;

    function renderQuiz() {
      const q = quizData[currentQuizIndex];
      document.getElementById('quiz-count').innerText = `題目 ${currentQuizIndex + 1} / ${quizData.length}`;
      document.getElementById('quiz-korean-text').innerText = q.korean;
      document.getElementById('next-quiz-btn').style.display = 'none';

      const optionsContainer = document.getElementById('quiz-options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx, q.answer);
        optionsContainer.appendChild(btn);
      });

      // ⚠️ 關鍵點：載入題目時「完全不呼叫」speakKorean，測驗者有需要再按喇叭
    }

    function playCurrentQuizAudio() {
      const currentWord = quizData[currentQuizIndex].korean;
      speakKorean(currentWord);
    }

    function checkAnswer(selectedIndex, correctIndex) {
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === correctIndex) {
          btn.classList.add('correct');
        }
        if (idx === selectedIndex && selectedIndex !== correctIndex) {
          btn.classList.add('wrong');
        }
      });
      document.getElementById('next-quiz-btn').style.display = 'inline-block';
    }

    function loadNextQuestion() {
      currentQuizIndex = (currentQuizIndex + 1) % quizData.length;
      renderQuiz();
    }

    /* ==========================================
       4. 文法資料庫 (含 PDF 特殊變化內容)
       ========================================== */
    const grammarData = [
      {
        title: "特殊變化",
        category: "動詞 / 形容詞語尾變化",
        description: "韓文動詞與形容詞接 -아요/어요 (半敬語/平語) 時的規則與 5 大不規則變化法則。",
        content: `
          <div class="grammar-detail">
            <h3>一、 規則變化 (규칙 변화)</h3>
            <p><b>1. 母音為 ㅏ, ㅗ, ㅑ ➔ 接 -아요</b></p>
            <ul>
              <li>깎다 ➔ <b>깎아요</b> (殺價) <button class="audio-btn" onclick="speakKorean('깎아요')">🔊</button></li>
              <li>맞다 ➔ <b>맞아요</b> (正確) <button class="audio-btn" onclick="speakKorean('맞아요')">🔊</button></li>
              <li>살다 ➔ <b>살아요</b> (居住) <button class="audio-btn" onclick="speakKorean('살아요')">🔊</button></li>
              <li>앉다 ➔ <b>앉아요</b> (坐) <button class="audio-btn" onclick="speakKorean('앉아요')">🔊</button></li>
              <li>작다 ➔ <b>작아요</b> (小) <button class="audio-btn" onclick="speakKorean('작아요')">🔊</button></li>
            </ul>

            <p><b>2. 母音為其他 (ㅓ, ㅜ, ㅡ, ㅣ等) ➔ 接 -어요</b></p>
            <ul>
              <li>먹다 ➔ <b>먹어요</b> (吃) <button class="audio-btn" onclick="speakKorean('먹어요')">🔊</button></li>
              <li>쉬다 ➔ <b>쉬어요</b> (休息) <button class="audio-btn" onclick="speakKorean('쉬어요')">🔊</button></li>
              <li>있다 ➔ <b>있어요</b> (在/有) <button class="audio-btn" onclick="speakKorean('있어요')">🔊</button></li>
              <li>물다 ➔ <b>물어요</b> (咬) <button class="audio-btn" onclick="speakKorean('물어요')">🔊</button></li>
              <li>없다 ➔ <b>없어요</b> (沒有) <button class="audio-btn" onclick="speakKorean('없어요')">🔊</button></li>
              <li>적다 ➔ <b>적어요</b> (少) <button class="audio-btn" onclick="speakKorean('적어요')">🔊</button></li>
              <li>열다 ➔ <b>열어요</b> (開門) <button class="audio-btn" onclick="speakKorean('열어요')">🔊</button></li>
            </ul>

            <p><b>3. -하다 結尾 ➔ 變 -해요</b></p>
            <ul>
              <li>공부하다 ➔ <b>공부해요</b> (讀書) <button class="audio-btn" onclick="speakKorean('공부해요')">🔊</button></li>
              <li>좋아하다 ➔ <b>좋아해요</b> (喜歡) <button class="audio-btn" onclick="speakKorean('좋아해요')">🔊</button></li>
              <li>사랑하다 ➔ <b>사랑해요</b> (愛) <button class="audio-btn" onclick="speakKorean('사랑해요')">🔊</button></li>
              <li>따뜻하다 ➔ <b>따뜻해요</b> (溫暖) <button class="audio-btn" onclick="speakKorean('따뜻해요')">🔊</button></li>
            </ul>

            <p><b>4. 無尾音時的縮合與 ㅡ 消失</b></p>
            <ul>
              <li>가다 ➔ <b>가요</b> / 오다 ➔ <b>와요</b> / 배우다 ➔ <b>배워요</b></li>
              <li>마시다 ➔ <b>마셔요</b> / 되다 ➔ <b>돼요</b> (可以)</li>
              <li>쓰다 ➔ <b>써요</b> (寫/苦) / 크다 ➔ <b>커요</b> (大)</li>
              <li>바쁘다 ➔ <b>바빠요</b> (忙) / 예쁘다 ➔ <b>예뻐요</b> (漂亮)</li>
              <li>아프다 ➔ <b>아파요</b> (痛) / 슬프다 ➔ <b>슬퍼요</b> (傷心)</li>
            </ul>

            <hr style="margin: 15px 0; border: none; border-top: 1px dashed #DDD;">

            <h3>二、 不規則變化 (불규칙 변화)</h3>
            
            <p><b>1. ㄷ 不規則 (ㄷ 遇到母音 ➔ 變 ㄹ)</b></p>
            <p>걷다 ➔ <b>걸어요</b> (走路), 듣다 ➔ <b>들어요</b> (聽), 묻다 ➔ <b>물어요</b> (問), 싣다 ➔ <b>실어요</b> (裝載)<br>
            <small style="color:#888;">*例外（維持規則）：믿다 ➔ 믿아요 (相信), 닫다 ➔ 닫아요 (關門), 받다 ➔ 받아요 (收到)</small></p>

            <br>
            <p><b>2. ㅂ 不規則 (ㅂ 遇到母音 ➔ 消失加 워)</b></p>
            <p>덥다 ➔ <b>더워요</b> (熱), 춥다 ➔ <b>추워요</b> (冷), 가볍다 ➔ <b>가벼워요</b> (輕), 무겁다 ➔ <b>무거워요</b> (重), 아름답다 ➔ <b>아름다워요</b> (美)<br>
            <small style="color:#e67e22;">*特例：돕다 ➔ 도와요 (幫助), 곱다 ➔ 고와요 (美麗)</small><br>
            <small style="color:#888;">*例外（維持規則）：입다 ➔ 입어요 (穿), 씹다 ➔ 씹어요 (嚼), 잡다 ➔ 잡아요 (抓), 좁다 ➔ 좁아요 (窄)</small></p>

            <br>
            <p><b>3. 르 不規則 (前字補尾音 ㄹ，르 變 라/러)</b></p>
            <p>모르다 ➔ <b>몰라요</b> (不知道), 빠르다 ➔ <b>빨라요</b> (快), 오르다 ➔ <b>올라요</b> (上升), 서두르다 ➔ <b>서둘러요</b> (趕緊), 부르다 ➔ <b>불러요</b> (唱/飽)</p>

            <br>
            <p><b>4. ㅎ 不規則 (ㅎ 消失，母音變 ㅐ / ㅙ)</b></p>
            <p>어떻다 ➔ <b>어때요</b> (如何), 노랗다 ➔ <b>노래요</b> (黃色), 까맣다 ➔ <b>까매요</b> (黑色), 그렇다 ➔ <b>그래요</b> (那樣)<br>
            <small style="color:#888;">*例外（維持規則）：좋다 ➔ 좋아요 (好), 낳다 ➔ 낳아요 (生/產)</small></p>

            <br>
            <p><b>5. ㅅ 不規則 (ㅅ 遇到母音 ➔ 消失)</b></p>
            <p>붓다 ➔ <b>부어요</b> (倒/腫), 짓다 ➔ <b>지어로 / 지어요</b> (做/蓋), 낫다 ➔ <b>나아요</b> (痊癒/更好), 젓다 ➔ <b>저어요</b> (攪拌)<br>
            <small style="color:#888;">*例外（維持規則）：웃다 ➔ 웃어요 (笑), 벗다 ➔ 벗어요 (脫), 씻다 ➔ 씻어요 (洗)</small></p>
          </div>
        `
      }
    ];

    function renderGrammar() {
      const container = document.getElementById('grammar-list-container');
      container.innerHTML = '';

      grammarData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <span class="badge">${item.category}</span>
          <div class="grammar-title">${item.title}</div>
          <p style="color: #666; font-size: 0.95rem; margin-bottom: 15px;">${item.description}</p>
          ${item.content}
        `;
        container.appendChild(card);
      });
    }

    // 初始化頁面
    window.onload = () => {
      renderQuiz();
      renderGrammar();
    };
  </script>

</body>
</html>
