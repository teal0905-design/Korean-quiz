<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>韓文互動學習 App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- 主選單分頁 -->
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchMainView('quiz')">🧩 句子測驗</button>
    <button class="nav-btn" onclick="switchMainView('vocabQuiz')">🔤 單字測驗</button>
    <button class="nav-btn" onclick="switchMainView('bank')">📚 學習資料庫</button>
    <!-- 👇 新增的第四個按鈕 -->
    <button class="nav-btn" onclick="switchMainView('numbers')">🔢 數字工具</button>
  </div>

  <!-- 1. 句子重組測驗 -->
  <div id="quizView" class="view-section active">
    <!-- 頂部平滑進度條 -->
    <div class="progress-track">
      <div class="progress-fill" id="sentenceProgressBar"></div>
    </div>

    <div class="filter-bar">
      <select id="sentenceLessonSelect" onchange="initSentenceQuiz()"></select>
      <select id="sentenceCountSelect" onchange="initSentenceQuiz()" style="display:none;">
        <option value="5">5 題</option>
        <option value="10" selected>10 題</option>
        <option value="15">15 題</option>
        <option value="20">20 題</option>
      </select>
    </div>
    <div class="prompt-box">
      <div class="prompt" id="promptText">載入中...</div>
      <button class="btn-audio" id="sentenceAudioBtn" onclick="playCurrentSentenceAudio()">🔊 聽發音</button>
    </div>
    <div class="answer-zone" id="answerZone"></div>
    <div class="word-bank" id="wordBank"></div>
    <div class="controls">
      <button class="btn btn-reset" onclick="resetSentenceQuiz()">重設卡片</button>
      <button class="btn btn-submit" id="submitBtn" onclick="handleSentenceSubmit()">檢查答案</button>
    </div>
    <div class="message" id="message"></div>
  </div>

  <!-- 2. 單字選擇測驗 -->
  <div id="vocabQuizView" class="view-section">
    <!-- 單字測驗進度條 -->
    <div class="progress-track">
      <div class="progress-fill" id="vocabQuizProgressBar"></div>
    </div>

    <div class="filter-bar">
      <select id="vocabQuizLessonSelect" onchange="startVocabQuiz()"></select>
      <select id="vocabQuizCountSelect" onchange="startVocabQuiz()">
        <option value="5">5 題</option>
        <option value="10" selected>10 題</option>
        <option value="15">15 題</option>
        <option value="20">20 題</option>
      </select>
    </div>
    <div class="prompt-box" style="justify-content: center; gap: 10px;">
      <div class="vocab-quiz-q" id="vocabQuizWord">-</div>
      <button class="btn-audio" id="vocabQuizAudioBtn" onclick="playVocabQuizAudio()">🔊 聽發音</button>
    </div>
    <div class="quiz-options" id="vocabQuizOptions"></div>
    <div class="message" id="vocabQuizMessage"></div>
    <button class="btn btn-submit" id="vocabNextBtn" style="display:none; width:100%;" onclick="nextVocabQuizQuestion()">下一題 ➔</button>
  </div>

  <!-- 3. 學習資料庫 -->
  <div id="bankView" class="view-section">
    <div class="sub-tabs">
      <button class="sub-btn active" id="btnSubGrammar" onclick="switchBankSubView('grammar')">📖 文法資料庫</button>
      <button class="sub-btn" id="btnSubVocab" onclick="switchBankSubView('vocab')">🎴 單字學習與測驗</button>
    </div>
    <div class="filter-bar">
      <select id="bankLessonSelect" onchange="filterBankData()"></select>
    </div>
    <div id="grammarSubView">
      <div id="grammarList"></div>
    </div>

    <!-- 單字子視圖 -->
    <div id="vocabSubView" style="display: none;">
      <div class="vocab-mode-tabs">
        <button class="vocab-mode-btn active" id="btnVocabModeList" onclick="switchVocabMode('list')">📋 單字清單預覽 (含例句)</button>
        <button class="vocab-mode-btn" id="btnVocabModeCard" onclick="switchVocabMode('card')">🎴 3D 翻牌練習</button>
      </div>

      <div id="vocabListView">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span style="font-size:0.9rem; color:var(--text-sub);">點擊發音按鈕可直接聆聽單字發音</span>
          <button class="btn-eye" id="togglePronBtnList" onclick="togglePronVisibility()">👁️ 連音顯示</button>
        </div>
        <div id="vocabListContainer"></div>
      </div>

      <div id="vocabCardView" style="display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <button class="btn-reset" style="padding: 6px 12px; border-radius: 6px; cursor:pointer;" onclick="shuffleVocabCards()">🔀 隨機排列</button>
          <button class="btn-eye" id="togglePronBtnCard" onclick="togglePronVisibility()">👁️ 連音顯示</button>
          <div style="font-weight:600; color:var(--text-sub);" id="vocabProgress">0 / 0</div>
        </div>
        <div class="slider-viewport">
          <div class="flip-card-wrapper slide-center" id="vocabCardWrapper" onclick="toggleCardFlip()">
            <div class="flip-card-inner">
              <div class="flip-card-front">
                <div class="vocab-kr" id="vocabKrDisplay">-</div>
                <div class="vocab-pron" id="vocabPronDisplay"></div>
                <div class="vocab-hint">💡 點擊卡片翻轉查看中文 (可左右滑動)</div>
              </div>
              <div class="flip-card-back">
                <div class="vocab-zh" id="vocabZhDisplay">-</div>
                <div class="vocab-hint" id="vocabCategoryDisplay">類別</div>
              </div>
            </div>
          </div>
        </div>
        <div class="controls">
          <button class="btn btn-reset" onclick="prevVocabCard()">⬅ 上一張</button>
          <button class="btn btn-reset" id="vocabCardAudioBtn" style="background:#EEF2FF; color:var(--primary); border:1px solid #C7D2FE;" onclick="playCurrentVocabCardAudio()">🔊 聽發音</button>
          <button class="btn btn-submit" onclick="nextVocabCard()">下一張 ➡️</button>
        </div>
      </div>
    </div>
  </div>

      <!-- 👇 4. 數字工具區 (轉換器 + 特訓測驗 + 數字單字庫) -->
  <div id="numbersView" class="view-section">
    <!-- 子選單切換 -->
    <div class="sub-tabs">
      <button class="sub-btn active" id="btnSubConverter" onclick="switchNumberSubView('converter')">🧮 轉換器</button>
      <button class="sub-btn" id="btnSubNumQuiz" onclick="switchNumberSubView('quiz')">⏳ 極限特訓</button>
      <!-- 新增第三個按鈕：數字單字庫 -->
      <button class="sub-btn" id="btnSubNumLib" onclick="switchNumberSubView('library')">📖 數字單字庫</button>
    </div>

    <!-- A. 轉換器視圖 -->
    <div id="converterSubView">
      <div class="number-converter-card" style="margin-bottom:0; box-shadow:none; border:none; padding:0;">
        <div class="converter-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3 style="font-size: 1.2rem; margin:0;">🔢 韓文數字自動轉換器</h3>
          <button class="btn-audio" onclick="alert('💡 小提示：\\n1, 2, 3, 4, 20 遇到單位會縮寫！\\n하나 ➔ 한\\n둘 ➔ 두\\n셋 ➔ 세\\n넷 ➔ 네\\n스물 ➔ 스무')">💡 變形速查</button>
        </div>
        <div class="converter-tabs" style="display: flex; gap: 8px; margin-bottom: 16px; background: #f1f5f9; padding: 4px; border-radius: 8px;">
          <button class="tab-btn active" id="tabTime" onclick="switchConverter('time')" style="flex: 1; padding: 8px 0; border: none; background: transparent; border-radius: 6px; font-weight:bold; cursor: pointer;">🕒 時間</button>
          <button class="tab-btn" id="tabUnit" onclick="switchConverter('unit')" style="flex: 1; padding: 8px 0; border: none; background: transparent; border-radius: 6px; font-weight:bold; cursor: pointer;">📏 單位金額</button>
          <button class="tab-btn" id="tabDate" onclick="switchConverter('date')" style="flex: 1; padding: 8px 0; border: none; background: transparent; border-radius: 6px; font-weight:bold; cursor: pointer;">📅 日期</button>
        </div>
        <div class="converter-body" id="converterBody"></div>
        <div class="converter-result" id="converterResult" style="background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 16px; text-align: center; margin-top: 16px; min-height: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
           <div style="color: #94a3b8;">請輸入數字，即可產生韓文與發音</div>
        </div>
      </div>
    </div>

    <!-- B. 極限特訓視圖 (隱藏) -->
    <div id="numQuizSubView" style="display: none;">
      <div class="quiz-card" style="margin-top: 16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
          <span style="font-size:0.9rem; color:var(--text-sub);">🔥 挑戰數字直覺反射！</span>
          <span id="numQuizScore" style="font-weight:bold; color:var(--primary); font-size: 1.1rem;">得分：0</span>
        </div>
        <div class="prompt-box" style="justify-content: center; min-height: 80px; text-align: center; flex-direction: column;">
          <div class="vocab-quiz-q" id="numQuizPrompt" style="font-size: 1.6rem; color:#1e293b;">-</div>
          <button class="btn-audio" id="numQuizAudioBtn" style="display:none; margin-top: 12px; align-self: center;">🔊 聽正確發音</button>
        </div>
        <div class="quiz-options" id="numQuizOptions" style="margin-top: 16px;"></div>
        <div class="message" id="numQuizMessage" style="margin-top: 16px; text-align: center;"></div>
        <button class="btn btn-submit" id="numQuizNextBtn" style="display:none; width:100%; margin-top: 16px;" onclick="nextNumQuiz()">下一題 ➔</button>
      </div>
    </div>

    <!-- 👇 C. 數字單字庫視圖 (全新加入) -->
    <div id="numLibrarySubView" style="display: none; margin-top: 16px;">
      
      <!-- 階層 1：路線選擇選單 -->
      <div id="numLibMenu">
        <h3 style="text-align:center; color:#1e293b; margin-bottom: 24px;">請選擇要學習的數字系統</h3>
        <div style="display:flex; flex-direction:column; gap: 16px;">
          <!-- 藍色按鈕：固有詞 -->
          <button class="btn btn-submit" style="background:#2563eb; padding:24px; font-size:1.3rem; border-radius:12px; border:none; display:flex; flex-direction:column; align-items:center; gap:8px;" onclick="openNumLibDetail('native')">
            🌸 韓式數字 (固有詞)
            <span style="font-size:0.9rem; font-weight:normal; opacity:0.9;">用於數量 (個/杯/瓶)、年齡、點鐘</span>
          </button>
          <!-- 紅色按鈕：漢字音 -->
          <button class="btn btn-submit" style="background:#dc2626; padding:24px; font-size:1.3rem; border-radius:12px; border:none; display:flex; flex-direction:column; align-items:center; gap:8px;" onclick="openNumLibDetail('sino')">
            🈴 漢字音數字
            <span style="font-size:0.9rem; font-weight:normal; opacity:0.9;">用於金額、日期、分鐘、號碼</span>
          </button>
        </div>
      </div>

      <!-- 階層 2：單字清單詳細頁 (套用原本單字卡樣式) -->
      <div id="numLibDetail" style="display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <button class="btn-reset" style="padding:6px 12px; border-radius:8px; cursor:pointer;" onclick="backToNumLibMenu()">⬅️ 返回</button>
          <h3 id="numLibDetailTitle" style="margin:0; color:#1e293b;">-</h3>
          <div style="width: 70px;"></div> <!-- 排版對齊用 -->
        </div>
        <!-- 這裡將由 JS 動態塞入跟原本單字一樣的卡片 -->
        <div id="numLibListContainer"></div>
      </div>

    </div>

  </div>



</div>

  <!-- 模組化載入 JavaScript -->
  <script src="app.js"></script>
  <script src="quiz.js"></script>
  <script src="bank.js"></script>
  <!-- 👇 引入數字邏輯 -->
  <script src="numbers.js"></script>
</body>
</html>
